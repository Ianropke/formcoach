name: FormCoach
options:
  bundleIdPrefix: com.ianropke
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  SWIFT_VERSION: "5.9"
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
  SUPPORTS_MACCATALYST: NO
  TARGETED_DEVICE_FAMILY: "1"

targets:
  FormCoachCore:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/FormCoachCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ianropke.formcoachcore
      PRODUCT_NAME: FormCoachCore
      DEFINES_MODULE: YES
      SKIP_INSTALL: YES
      SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      TARGETED_DEVICE_FAMILY: "1"

  FormCoach:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/FormCoachUI
    dependencies:
      - target: FormCoachCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ianropke.formcoach
      PRODUCT_NAME: FormCoach
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: "FormCoach"
      INFOPLIST_KEY_NSCameraUsageDescription: "FormCoach analyserer din træningsform og tæller gentagelser lokalt på din iPhone."
      INFOPLIST_KEY_NSMicrophoneUsageDescription: "FormCoach bruger mikrofonen under videooptagelse."
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      TARGETED_DEVICE_FAMILY: "1"
      CODE_SIGN_STYLE: Automatic

  FormCoachTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/FormCoachTests
    dependencies:
      - target: FormCoachCore
      - target: FormCoach
    settings:
      SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      TARGETED_DEVICE_FAMILY: "1"
